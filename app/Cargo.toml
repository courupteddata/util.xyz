[package]
name = "main-page"
version = "0.1.0"
authors = ["nathan <courupteddata@users.noreply.github.com>"]
edition = "2024"

[dependencies]
dioxus = { version = "0.7", features = ["router", "fullstack"] }
tower-http = { version = "0.7.1", features = ["fs"], optional = true }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "dep:tower-http"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
